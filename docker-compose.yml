services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx:/etc/nginx/conf.d:ro
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: ./docker/php.dockerfile
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: erp_inventory
      DB_USERNAME: erp_user
      DB_PASSWORD: erp_password
    command: >-
      sh -c "if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist --optimize-autoloader; fi; exec php-fpm"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    working_dir: /var/www/html
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - web

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: erp_inventory
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: erp_user
      MYSQL_PASSWORD: erp_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  backend_vendor:
  frontend_node_modules:
